# ==============================================================================
# NexERP Nginx Production Reverse Proxy Configuration
# - HTTP -> HTTPS redirect (301)
# - SSL termination with TLS 1.2/1.3 only
# - Security headers (HSTS, X-Frame, X-Content-Type, CSP)
# - Static React SPA served directly from /usr/share/nginx/html
# - API traffic proxied to FastAPI backend with connection pooling
# ==============================================================================

# ---- HTTP redirect to HTTPS ----
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# ---- HTTPS Main Server Block ----
server {
    listen 443 ssl http2;
    server_name nexerp.yourdomain.com;

    # ----- SSL/TLS Certificate Configuration -----
    ssl_certificate     /etc/ssl/nexerp/fullchain.pem;
    ssl_certificate_key /etc/ssl/nexerp/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # ----- HSTS (HTTP Strict Transport Security) -----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ----- Security Headers -----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https:; frame-ancestors 'self';" always;

    # ----- Request Size Limit -----
    client_max_body_size 50M;

    # ----- Gzip Compression -----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss image/svg+xml;

    # ----- Static Frontend (React SPA) -----
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ----- API Proxy to FastAPI Backend -----
    location /api/ {
        proxy_pass http://nexerp_app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;

        # Connection pooling
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ----- WebSocket support for real-time features -----
    location /ws/ {
        proxy_pass http://nexerp_app:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # ----- Block sensitive paths -----
    location ~ /\. {
        deny all;
        return 404;
    }
}
