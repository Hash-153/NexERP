# ==============================================================================
# NexERP Enterprise - Production Docker Compose Orchestration
# Services: FastAPI App, PostgreSQL 16, Redis 7, Celery Worker, Nginx Reverse Proxy
# ==============================================================================

version: "3.9"

services:
  # ============================================================
  # PostgreSQL 16 - Primary Relational Database
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: nexerp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexerp_prod}
      POSTGRES_USER: ${POSTGRES_USER:-nexerp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_secure_pass}
    volumes:
      - nexerp_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexerp_internal

  # ============================================================
  # Redis 7 - Session Cache & Celery Message Broker
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: nexerp_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme_redis_pass} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - nexerp_redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD:-changeme_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexerp_internal

  # ============================================================
  # NexERP FastAPI Application Server
  # ============================================================
  nexerp_app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: nexerp_app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nexerp}:${POSTGRES_PASSWORD:-changeme_secure_pass}@postgres:5432/${POSTGRES_DB:-nexerp_prod}
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme_redis_pass}@redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_this_to_256bit_random_key_in_production}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 60
      NEXERP_ENV: production
      LOG_LEVEL: info
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,https://yourdomain.com}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - nexerp_uploads:/app/uploads
    networks:
      - nexerp_internal
      - nexerp_public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ============================================================
  # Celery Worker - Async Background Job Processor
  # (Payroll runs, MRP explosion, report generation, email notifications)
  # ============================================================
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: nexerp_celery
    restart: unless-stopped
    command: ["celery", "-A", "backend.src.core.celery_app:celery_app", "worker", "--loglevel=info", "--concurrency=4", "-Q", "default,payroll,mrp,reports"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nexerp}:${POSTGRES_PASSWORD:-changeme_secure_pass}@postgres:5432/${POSTGRES_DB:-nexerp_prod}
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme_redis_pass}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-changeme_redis_pass}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-changeme_redis_pass}@redis:6379/2
      NEXERP_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nexerp_internal

  # ============================================================
  # Nginx Reverse Proxy - SSL Termination & Static File Serving
  # ============================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: nexerp_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nexerp.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - nexerp_ssl_certs:/etc/ssl/nexerp:ro
    depends_on:
      - nexerp_app
    networks:
      - nexerp_public
      - nexerp_internal

# ============================================================
# Volumes
# ============================================================
volumes:
  nexerp_pgdata:
    driver: local
  nexerp_redis_data:
    driver: local
  nexerp_uploads:
    driver: local
  nexerp_ssl_certs:
    driver: local

# ============================================================
# Networks
# ============================================================
networks:
  nexerp_internal:
    driver: bridge
    internal: true
  nexerp_public:
    driver: bridge
